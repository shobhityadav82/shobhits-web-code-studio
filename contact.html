<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Shobhit Web</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav-wrap"><nav class="nav container"><a class="brand" href="/"><span class="brand-mark">S</span>Shobhit Web</a><button class="menu-btn" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="nav-links" id="navLinks"><a href="/">Home</a><a href="/roadmap.html">Roadmap</a><a href="/projects.html">Projects</a><a href="/contact.html">Contact</a></div></nav></header><section class="page-hero"><div class="container"><span class="eyebrow">SAY HELLO</span><h1>Let's talk about your idea</h1><p class="lead">Send feedback or a learning question.</p></div></section><main class="section container grid-3"><div><h2>Have a question?</h2><p class="muted">This starter validates the form but does not send email. Connect an email service before launch.</p></div><section class="auth-card" style="grid-column:span 2"><form id="contactForm"><div class="field"><label for="name">Name</label><input id="name" name="name" required minlength="2" maxlength="60"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" required></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" required minlength="10" maxlength="2000"></textarea></div><button class="btn btn-primary full" type="submit">Send message</button><p id="formMessage" class="message" role="status" aria-live="polite"></p></form></section></main><footer class="footer"><div class="container footer-inner"><span>© <span id="year"></span> Shobhit Web</span><a href="/">Home</a></div></footer><script src="/config.js"></script><script src="/app.js"></script></body></html>
